syntax = "proto3";

package github.com.PechatnovVladimir.msa_big_tech.auth.api.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/PechatnovVladimir/msa_big_tech/auth/pkg/api/auth/v1;auth";

//RegisterRequest - запрос Register
message RegisterRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "RegisterRequest"
      description: "RegisterRequest - запрос Register"
      required: [
        "email",
        "password"
      ]
    }
    external_docs: {
      url: "https://github.com/grpc-ecosystem/grpc-gateway"
      description: "Find out more about ABitOfEverything"
    }
  };

  //email - e-mail пользователя
  string email = 1 [
    json_name = "email",
    (buf.validate.field).required = true,
    (buf.validate.field).string.email = true,
    (google.api.field_behavior) = REQUIRED
  ];
  //password - пароль пользователя длина от 8 до 128 символов
  string password = 2 [
    json_name = "password",
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      pattern: "[A-Za-z0-9!@#$%^&*]{8,128}$"
      min_len: 8
      max_len: 128
    },
    (google.api.field_behavior) = REQUIRED
  ];
}

//RegisterResponse - ответ Register
message RegisterResponse {
  //user_id - ID пользователя
  string user_id = 1;
}

//LoginRequest - запрос Login
message LoginRequest {
  string email = 1 [
    json_name = "email",
    (buf.validate.field).required = true,
    (buf.validate.field).string.email = true,
    (google.api.field_behavior) = REQUIRED
  ];
  string password = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 3
      max_len: 20
      pattern: "^[a-z0-9_]{3,20}$"
    },
    (google.api.field_behavior) = REQUIRED
  ];
}

//LoginResponse - ответ Login
message LoginResponse {
  //access_token - Access token
  string access_token = 1;
  //refresh_token - Refresh token
  string refresh_token = 2;
  //user_id - ID пользователя
  string user_id = 3;
}

//RefreshRequest - запрос Refresh
message RefreshRequest {
  //refresh_token - Refresh token
  string refresh_token = 1;
}

//RefreshResponse - ответ Refresh
message RefreshResponse {
  //access_token - Access token
  string access_token = 1;
  //refresh_token - Refresh token
  string refresh_token = 2;
  //user_id - ID пользователя
  string user_id = 3;
}
