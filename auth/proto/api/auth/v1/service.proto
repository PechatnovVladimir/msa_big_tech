syntax = "proto3";

package  github.com.PechatnovVladimir.msa_big_tech.auth.api.v1;

option go_package = "github.com/PechatnovVladimir/msa_big_tech/auth/pkg/api/auth/v1;auth";

import "api/auth/v1/messages.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Auth API";
    version: "1.0";
    description: "API auth-service";
  };
  schemes: HTTP;
};


service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/v1/auth/Register"
      body: "*"
    };
  }

  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/Login"
      body: "*"
    };

  }

  rpc Refresh(RefreshRequest) returns (RefreshResponse) {
    option (google.api.http) = {
      post: "/v1/auth/Refresh"
      body: "*"
    };

  }
}
