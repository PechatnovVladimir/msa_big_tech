syntax = "proto3";

package github.com.PechatnovVladimir.msa_big_tech.users.api.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/PechatnovVladimir/msa_big_tech/users/pkg/api/users/v1;users";

//UserProfile - профиль пользователя
message UserProfile {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "UserProfile"
      description: "UserProfile - профиль пользователя"
      required: [
        "user_id",
        "email",
        "nickname",
        "bio",
        "avatar_url"
      ]
      example: "{\"nickname\": \"pvv\", \"email\": \"my-mail@mail.ru\", \"bio\": \"biography pvv\", \"avatar_url\": \"pvv.jpg\"}"
    }
    external_docs: {
      url: "https://github.com/grpc-ecosystem/grpc-gateway"
      description: "Find out more about ABitOfEverything"
    }
  };

  //user_id уникальный идентификатор пользователя в формате UUID
  string user_id = 1;
  //email email пользователя
  string email = 2;
  //nickname никнейм пользователя
  string nickname = 3;
  //bio биография пользователя
  string bio = 4;
  //avatar_url ссылка на аватарку пользователя
  string avatar_url = 5;
}

//CreateProfileRequest - запрос CreateProfile
message CreateProfileRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "CreateProfileRequest"
      description: "CreateProfileRequest - запрос CreateProfile"
      required: [
        "userid",
        "email",
        "nickname"
      ]
    }
    external_docs: {
      url: "https://github.com/grpc-ecosystem/grpc-gateway"
      description: "Find out more about ABitOfEverything"
    }
  };

  //user_id - ID пользователя
  string user_id = 1 [
    json_name = "userid",
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true,
    (google.api.field_behavior) = REQUIRED

  ];
  //nickname - никнейм пользователя
  string email = 2 [
    json_name = "email",
    (buf.validate.field).required = true,
    (buf.validate.field).string.email = true,
    (google.api.field_behavior) = REQUIRED
  ];

  //nickname - никнейм пользователя
  string nickname = 3 [
    json_name = "nickname",
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 3,
      max_len: 20,
      pattern: "^[a-z0-9_]{3,20}$",
    },
    (google.api.field_behavior) = REQUIRED
  ];
  //bio биография пользователя
  optional string bio = 4[
    json_name = "bio",
    (buf.validate.field).required = false,
    (google.api.field_behavior) = OPTIONAL
  ];
  //avatar_url ссылка на аватарку пользователя
  optional string avatar_url = 5 [
    json_name = "avatarUrl",
    (buf.validate.field).required = false,
    (google.api.field_behavior) = OPTIONAL
  ];
}

//CreateProfileResponse - ответ CreateProfile
message CreateProfileResponse {
  //UserProfile - полный профайл пользователя
  UserProfile UserProfile = 1;
}

//UpdateProfileRequest - запрос UpdateProfile
message UpdateProfileRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "UpdateProfileRequest"
      description: "UpdateProfileRequest - запрос UpdateProfile"
      required: [
        "user_id"
      ]
    }
    external_docs: {
      url: "https://github.com/grpc-ecosystem/grpc-gateway"
      description: "Find out more about ABitOfEverything"
    }
  };

  //user_id - ID пользователя в формате UUID
  string user_id = 1 [
    json_name = "userid",
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true,
    (google.api.field_behavior) = REQUIRED
  ];
  optional string email = 2 [
    json_name = "email",
    (buf.validate.field).required = false,
    (buf.validate.field).string.email = true,
    (google.api.field_behavior) = OPTIONAL
  ];
  optional string nickname = 3 [
    json_name = "nickname",
    (buf.validate.field).required = false,
    (buf.validate.field).string = {
      min_len: 3,
      max_len: 20,
      pattern: "^[a-z0-9_]{3,20}$",
    },
    (google.api.field_behavior) = OPTIONAL
  ];
  optional string bio = 4 [
    json_name = "bio",
    (buf.validate.field).required = false,
    (google.api.field_behavior) = OPTIONAL
  ];
  optional string avatar_url = 5 [
    json_name = "avatarurl",
    (buf.validate.field).required = false,
    (google.api.field_behavior) = OPTIONAL
  ];
}

//UpdateProfileResponse - UpdateProfile ответ
message UpdateProfileResponse {
  //UserProfile - профайл пользователя
  UserProfile UserProfile = 1;
}

//GetProfileByIDRequest - GetProfileByID запрос
message GetProfileByIDRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "GetProfileByIDRequest"
      description: "GetProfileByIDRequest - запрос GetProfileByID"
      required: [
        "user_id"
      ]
    }
    external_docs: {
      url: "https://github.com/grpc-ecosystem/grpc-gateway"
      description: "Find out more about ABitOfEverything"
    }
  };

  //user_id - ID пользователя в формате UUID
  string user_id = 1 [
    json_name = "userid",
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true,
    (google.api.field_behavior) = REQUIRED
  ];
}

//GetProfileByIDResponse - GetProfileByID ответ
message GetProfileByIDResponse {
  //UserProfile - профиль пользователя
  UserProfile UserProfile = 1;
}

message GetProfileByNicknameRequest {
  string nickname = 1;
}

message GetProfileByNicknameResponse {
  UserProfile UserProfile = 1;
}

message Query {
  //список ID пользователей
  repeated string IDs = 1;
  optional string email = 2;
  optional string nickname = 3;
  optional google.protobuf.Timestamp createdfrom = 4;
  optional google.protobuf.Timestamp createdto = 5;
}

message SearchByNicknameRequest {
  Query query = 1;
  uint64 limit = 2;
}

message SearchByNicknameResponse {
  repeated UserProfile UserProfile = 1;
}
