syntax = "proto3";

package github.com.PechatnovVladimir.msa_big_tech.users.api.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/PechatnovVladimir/msa_big_tech/users/pkg/api/users/v1;users";

//UserProfile - профиль пользовател
message UserProfile {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "UserProfile"
      description: "UserProfile - профиль пользователя"
      required: [
        "user_id",
        "nickname"
        "bio"
        "avatar_url"
      ]
      example: "{\"nickname\": \"pvv\", \"bio\": \"biography pvv\", \"avatar_url\": \"pvv.jpg\"}"
    }
    external_docs: {
      url: "https://github.com/grpc-ecosystem/grpc-gateway"
      description: "Find out more about ABitOfEverything"
    }
  };

  //user_id уникальный идентификатор пользователя в формате UUID генерируется автоматически при создании профиля
  string user_id = 1;
  //nickname никнейм пользователя
  string nickname = 2;
  //bio биография пользователя
  string bio = 3;
  //avatar_url ссылка на аватарку пользователя
  string avatar_url = 4;
}

//CreateProfileRequest - запрос CreateProfile
message CreateProfileRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "CreateProfileRequest"
      description: "CreateProfileRequest - запрос CreateProfile"
      required: [
        "nickname",
        "password"
      ]
    }
    external_docs: {
      url: "https://github.com/grpc-ecosystem/grpc-gateway"
      description: "Find out more about ABitOfEverything"
    }
  };

  //nickname - никнейм пользователя
  string nickname = 1 [
    json_name = "nickname",
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 10,
    (google.api.field_behavior) = REQUIRED
  ];
  //bio биография пользователя
  optional string bio = 2 [
    json_name = "bio",
    (buf.validate.field).required = false,
    (google.api.field_behavior) = OPTIONAL
  ];
  //avatar_url ссылка на аватарку пользователя
  optional string avatar_url = 3 [
    json_name = "avatarUrl",
    (buf.validate.field).required = false,
    (google.api.field_behavior) = OPTIONAL
  ];
  //password пароль
  string password = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_len = 20,
    (google.api.field_behavior) = REQUIRED
  ];
}

//CreateProfileResponse - ответ CreateProfile
message CreateProfileResponse {
  //UserProfile - полный профайл пользователя
  UserProfile UserProfile = 1;
}

message UpdateProfileRequest {
  string user_id = 1;
  optional string nickname = 2;
  optional string bio = 3;
  optional string avatar_url = 4;
  optional string password = 5;
}

message UpdateProfileResponse {
  UserProfile UserProfile = 1;
}

message GetProfileByIDRequest {
  string user_id = 1;
}

message GetProfileByIDResponse {
  UserProfile UserProfile = 1;
}

message GetProfileByNicknameRequest {
  string nickname = 1;
}

message GetProfileByNicknameResponse {
  UserProfile UserProfile = 1;
}

message SearchByNicknameRequest {
  string query = 1;
  int64 limit = 2;
}

message SearchByNicknameResponse {
  repeated UserProfile UserProfile = 1;
}
