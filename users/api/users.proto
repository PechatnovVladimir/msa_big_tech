syntax = "proto3";

package  github.com.PechatnovVladimir.msa_big_tech.users.api;

option go_package = "github.com/PechatnovVladimir/msa_big_tech/users/pkg;users";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Users API";
    version: "1.0";
    description: "API users-service";
  };
  schemes: HTTP;
};


message UserProfile {
  int64 user_id = 1;
  string nickname = 2;
  string bio = 3;
  string avatar_url = 4;
}

service UserService {
  //создать профиль пользователя
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse) {
    option (google.api.http) = {
      post: "/v1/users/CreateProfile"
      body: "*"
    };
  }

  //обновить профиль пользователя
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (google.api.http) = {
      patch: "/v1/users/UpdateProfile"
      body: "*"
    };
  }

  //получить профиль по ID
  rpc GetProfileByID(GetProfileByIDRequest) returns (GetProfileByIDResponse) {
    option (google.api.http) = {
      get: "/v1/users/GetProfileByID/{user_id}"
    };
  }

  //поиск по нику
  rpc GetProfileByNickname(GetProfileByNicknameRequest) returns (GetProfileByNicknameResponse) {
    option (google.api.http) = {
      get: "/v1/users/GetProfileByNickname/{nickname}"
    };
  }

  //поиск пользователей
  rpc SearchByNickname(SearchByNicknameRequest) returns (SearchByNicknameResponse) {
    option (google.api.http) = {
      post: "/v1/users/SearchByNickname"
    };
  }
}

message CreateProfileRequest {
  int64 user_id = 1;
  string nickname = 2;
  optional string bio = 3;
  optional string avatar_url = 4;
}

message CreateProfileResponse {
  UserProfile UserProfile = 1;
}

message UpdateProfileRequest {
  int64 user_id = 1;
  optional string nickname = 2;
  optional string bio = 3;
  optional string avatar_url = 4;
}

message UpdateProfileResponse {
  UserProfile UserProfile = 1;
}

message GetProfileByIDRequest {
  int64 user_id = 1;
}

message GetProfileByIDResponse {
  UserProfile UserProfile = 1;
}

message GetProfileByNicknameRequest {
  string nickname = 1;
}

message GetProfileByNicknameResponse {
  UserProfile UserProfile = 1;
}

message SearchByNicknameRequest {
  string query = 1;
  int64 limit = 2;
}

message SearchByNicknameResponse{
  repeated UserProfile UserProfile = 1;
}