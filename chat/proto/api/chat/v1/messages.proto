syntax = "proto3";

package  github.com.PechatnovVladimir.msa_big_tech.chat.api.v1;

option go_package = "github.com/PechatnovVladimir/msa_big_tech/chat/pkg/api/chat/v1;chat";

import "google/protobuf/timestamp.proto";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

message Chat {
  int64 chat_id = 1;
  string name = 2;
}

message Message {
  int64 message_id = 1;
  string text = 2;
}

message CreateDirectChatRequest {
  int64 participant_id = 1;
}

message CreateDirectChatResponse {
  int64 chat_id = 1;
}

message GetChatRequest{
  int64 chat_id = 1;
}

message GetChatResponse{
  Chat chat = 1;
}

message ListUserChatsRequest{
  int64 user_id =1;
}

message ListUserChatsResponse{
  repeated Chat chats = 1;
}

message ListChatMembersRequest {
  int64 chat_id = 1;
}

message ListChatMembersResponse{
  repeated int64 user_ids = 1;
}

message SendMessageRequest {
  int64 chat_id =1;
  string text = 2;
}

message SendMessageResponse {
  Message message = 1;
}

message Cursor {
  int64 message_id = 1;
  google.protobuf.Timestamp created_at = 2;
}

message ListMessagesRequest{
  int64 chat_id = 1;
  int64 limit = 2;
  Cursor cursor = 3;
}

message ListMessagesResponse{
  repeated Message messages = 1;
  optional Cursor next_cursor = 2;
}

message StreamMessagesRequest {
  int64 chat_id = 1;
  optional google.protobuf.Timestamp since_unix_ms = 2;
}

message StreamMessagesResponse {
  Message message = 1;
}


