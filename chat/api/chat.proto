syntax = "proto3";

package  github.com.PechatnovVladimir.msa_big_tech.chat.api;

option go_package = "github.com/PechatnovVladimir/msa_big_tech/chat/pkg;chat";

import "google/protobuf/timestamp.proto";

import "google/api/annotations.proto";

message Chat {
  int64 chat_id = 1;
  string name = 2;
}

message Message {
  int64 message_id = 1;
  string text = 2;
}


service ChatService {
  rpc CreateDirectChat (CreateDirectChatRequest) returns (CreateDirectChatResponse) {
    option (google.api.http) = {
      post: "/chat/v1/CreateDirectChat"
      body: "*"
    };
  }
  rpc GetChat (GetChatRequest) returns (GetChatResponse) {
    option (google.api.http) = {
      get: "/chat/v1/GetChat/{chat_id}"
    };
  }
  rpc ListUserChats (ListUserChatsRequest) returns (ListUserChatsResponse) {
    option (google.api.http) = {
      get: "/chat/v1/ListUserChats/{user_id}"
    };

  }
  rpc ListChatMembers (ListChatMembersRequest) returns (ListChatMembersResponse) {
    option (google.api.http) = {
      get: "/chat/v1/ListChatMembers/{chat_id}"
    };

  }
  rpc SendMessage (SendMessageRequest) returns (SendMessageResponse) {
    option (google.api.http) = {
      post: "/chat/v1/SendMessage"
      body: "*"
    };
  }
  rpc ListMessages (ListMessagesRequest) returns (ListMessagesResponse) {
    option (google.api.http) = {
      get: "/chat/v1/ListMessages/{chat_id}"
    };
  }
  rpc StreamMessages (StreamMessagesRequest) returns (stream StreamMessagesResponse){}
}

message CreateDirectChatRequest {
  int64 participant_id = 1;
}

message CreateDirectChatResponse {
  int64 chat_id = 1;
}

message GetChatRequest{
  int64 chat_id = 1;
}

message GetChatResponse{
  Chat chat = 1;
}

message ListUserChatsRequest{
  int64 user_id =1;
}

message ListUserChatsResponse{
  repeated Chat chats = 1;
}

message ListChatMembersRequest {
  int64 chat_id = 1;
}

message ListChatMembersResponse{
  repeated int64 user_ids = 1;
}

message SendMessageRequest {
  int64 chat_id =1;
  string text = 2;
}

message SendMessageResponse {
  Message message = 1;
}

message Cursor {
  int64 message_id = 1;
  google.protobuf.Timestamp created_at = 2;
}

message ListMessagesRequest{
  int64 chat_id = 1;
  int64 limit = 2;
  Cursor cursor = 3;
}

message ListMessagesResponse{
  repeated Message messages = 1;
  optional Cursor next_cursor = 2;
}

message StreamMessagesRequest {
  int64 chat_id = 1;
  optional google.protobuf.Timestamp since_unix_ms = 2;
}

message StreamMessagesResponse {
  Message message = 1;
}


