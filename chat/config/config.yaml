app:
  name:     CHAT_SERVICE
  version:  v.0.0.1
  mode:     debug # debug | production
postgres:
  host:     localhost
  port:     5432
  database: postgres-chat
  user:     postgres-chat-user
  password: postgres-chat-psw
  sslmode:  disable
grpc:
  server:
    host: localhost
    port: 50052
  client:
    timeout: 2s                 # общий deadline на RPC, можно overridden per-call
    retry:
      maxAttempts: 3
      backoff:
        base: 100ms
        max: 2s
        jitter: true
      retryableCodes: ["UNAVAILABLE","DEADLINE_EXCEEDED","RESOURCE_EXHAUSTED","ABORTED"]
    circuitBreaker:
      failuresForOpen: 5        # за окно
      window: 30s
      halfOpenMaxCalls: 5
      openStateFor: 60s
    metrics: true
kafka_producer:
  brokers: localhost:9092
kafka_consumer:
  brokers: localhost:9092
